<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assinatura Confirmada | HeinSoft Company</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="/images/logo/favicon.svg"
      type="image/svg+xml"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Line Awesome (Ícones) -->
    <link
      rel="stylesheet"
      href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css"
    />

    <!-- Anti-indexação -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Proteção contra acesso direto -->
    <script>
      const ref = document.referrer;
      if (!ref.includes('mercadopago.com')) {
        window.location.href = '/index.html';
      }
    </script>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
    </style>
  </head>

  <body class="bg-black text-white font-pacifico">
    <div class="container my-5">
      <div
        class="position-relative p-5 text-center bg-dark border border-dashed border-secondary rounded-5 shadow-lg"
      >
        <button
          type="button"
          class="position-absolute top-0 end-0 p-3 m-3 btn-close btn-close-white"
          aria-label="Fechar"
          onclick="window.location.href='/index.html'"
        ></button>

        <!-- Ícone de sucesso -->
        <div class="mb-3">
          <i
            class="las la-check-circle"
            style="font-size: 3rem; color: #0f0"
          ></i>
        </div>

        <h1 class="fw-bold fs-3 mb-3 font-pacifico">
          Assinatura confirmada com sucesso!
        </h1>

        <p class="col-lg-8 mx-auto mb-4 text-white text-opacity-75">
          Agradecemos por confiar na HeinSoft Company. Sua assinatura foi
          processada com sucesso e nossa equipe entrará em contato em breve com
          os próximos passos. Enquanto isso, fique à vontade para explorar nosso
          site.
        </p>

        <a
          href="/index.html"
          class="btn btn-gradient text-center font-pacifico px-4"
          >Voltar para o início</a
        >
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
